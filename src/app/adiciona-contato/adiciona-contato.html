<div class="container">
    <h1>Novo Contato</h1>

    <form (Submit)="adicionarContato()">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required>
        </div>
        <div>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required>
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="aniversario">Aniversário:</label>
            <input type="date" id="aniversario" name="aniversario">
        </div>

        <div>
            <label for="tipo">Tipo:</label>
            <input type="text" id="aniversario" name="tipo">
        </div>
        <button type="submit">Cadastrar</button>
    </form>

    <hr>

  <h2>Lista de Contatos</h2>

  <table border="1" *ngIf="contatos.length > 0">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
        <th>E-mail</th>
        <th>Aniversário</th>
        <th>Tipo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let contato of contatos">
        <td>{{ contato.nome }}</td>
        <td>{{ contato.telefone }}</td>
        <td>{{ contato.email }}</td>
        <td>{{ contato.aniversario }}</td>
        <td>{{ contato.tipo }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="contatos.length === 0">Nenhum contato cadastrado ainda.</p>
</div>
