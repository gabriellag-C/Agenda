<div class ="container mt-4">
  <h1 class="mb-3">Novo Contato</h1>

  <form>
    <label for="nome" class="form-label">Nome:</label>
    <input type="text" id="nome" #nome class="form-control mb-2">

    <label for="email" class="form-label">Email:</label>
    <input type="text" id="email" #email class="form-control mb-2">

    <label for="aniversario" class="form-label">Aniversário:</label>
    <input type="date" id="aniversario" #aniversario class="form-control mb-2">

    <label for="telefone" class="form-label">Telefone:</label>
    <input type="text" id="telefone" #tel class="form-control mb-2">

    <label for="tipo" class="form-label">Tipo:</label>
    <select id="tipo" #tipo class="form-control mb-3">
      @for (item of SELECT_TIPO; track item.id){
        <option [value] ="item.value">{{ item.value }}</option>
      }
    </select>
    <div class = "mb-4">
      <button type="button" class="btn btn-primary" (click)="adicionar(nome.value, email.value,aniversario.value,tel.value,tipo.value);
      nome.value = '';email.value = ''; aniversario.value = ''; tel.value = ''"> 
      Adicionar contato
      </button>
    </div>
  </form>

  <h2 class="mb-3">Lista de Contatos</h2>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Aniversário</th>
        <th>Telefone</th>
        <th>Tipo</th>
      </tr>
    </thead>
    <tbody>
      @for (contato of contatos; track $index) {
        <tr>
          <td>{{contato.nome}}</td>
          <td>{{contato.email}}</td>
          <td>{{contato.aniversario}}</td>
          <td>{{contato.telefone}}</td>
          <td>{{contato.tipo}}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
